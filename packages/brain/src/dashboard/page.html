<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitburner-agent</title>
<style>
  :root { --bad: #b3261e; --ok: #1e6b3a; --muted: #666; --line: #ddd; --background: #fff; --text: #111; }
  @media (prefers-color-scheme: dark) {
    :root { --bad: #ff8a80; --ok: #7bd88f; --muted: #aaa; --line: #333; --background: #121212; --text: #eee; }
  }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: var(--background); color: var(--text); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); font-weight: 600; }
  .ok { color: var(--ok); font-weight: 600; }
  table { border-collapse: collapse; }
  td, th { text-align: left; padding: 2px 12px 2px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  #problem { padding: 10px; border: 2px solid var(--bad); color: var(--bad); font-weight: 600; }
  code { font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>bitburner-agent</h1>
<div class="muted" id="brain"></div>
<div id="problem" hidden></div>
<main hidden>
  <section id="alerts"><h2>Alerts</h2><div></div></section>
  <section id="agent"><h2>Agent</h2><table></table></section>
  <section id="tiers"><h2>Last snapshot per tier</h2><table></table></section>
  <section id="values"><h2>Game</h2><table></table></section>
  <section id="gaps"><h2>Gaps in the last 24 h</h2><div></div></section>
  <section id="supervision">
    <h2>Supervision</h2><div></div><button type="button">Pause supervision</button>
    <div class="bad" id="supervision-problem" hidden></div>
  </section>
  <section id="hack-loop">
    <h2>Hack loop</h2><div></div><button type="button">Stop the hack loop</button>
    <div class="bad" id="hack-loop-problem" hidden></div>
  </section>
  <section id="programs">
    <h2>Hacking programs</h2><div></div><button type="button">Stop buying programs</button>
    <div class="bad" id="programs-problem" hidden></div>
  </section>
  <section id="home-ram">
    <h2>Home RAM</h2><div></div><button type="button">Stop upgrading home RAM</button>
    <div class="bad" id="home-ram-problem" hidden></div>
  </section>
  <section id="intents">
    <h2>Intents</h2><table></table>
    <form>
      <select name="action" aria-label="Action">
        <option>travel</option><option>buyTor</option><option>buyProgram</option><option>upgradeHomeRam</option>
        <option>joinFaction</option><option>purchaseAugmentation</option><option>installAugmentations</option>
      </select>
      <input name="args" aria-label="Arguments (JSON)" size="40" value='{"city": "Aevum"}'>
      <button type="submit">Queue it</button>
    </form>
    <div class="bad" id="intents-problem" hidden></div>
  </section>
  <section id="work">
    <h2>Work</h2><div></div>
    <form id="faction-work">
      <input name="faction" aria-label="Faction" value="CyberSec">
      <select name="workType" aria-label="Work type">
        <option>hacking</option><option>field</option><option>security</option>
      </select>
      <button type="submit">Work at it</button>
      <button type="button" id="stop-work">Stop managing work</button>
    </form>
    <form id="company-work">
      <input name="company" aria-label="Company" value="Noodle Bar">
      <select name="field" aria-label="Job field">
        <option>Software</option><option>Software Consultant</option><option>IT</option><option>Security Engineer</option><option>Network Engineer</option><option>Business</option><option>Business Consultant</option><option>Security</option><option>Agent</option><option>Employee</option><option>Part-time Employee</option><option selected>Waiter</option><option>Part-time Waiter</option>
      </select>
      <button type="submit">Work there</button>
    </form>
    <form id="crime-work">
      <select name="crime" aria-label="Crime">
        <option>Shoplift</option><option>Rob Store</option><option>Mug</option><option>Larceny</option><option>Deal Drugs</option><option>Bond Forgery</option><option>Traffick Arms</option><option>Homicide</option><option>Grand Theft Auto</option><option>Kidnap</option><option>Assassination</option><option>Heist</option>
      </select>
      <button type="submit">Commit it</button>
    </form>
    <div class="bad" id="work-problem" hidden></div>
  </section>
  <section id="events"><h2>Recent events</h2><table></table></section>
</main>
<script>
"use strict";
// The dashboard (#93): polls the brain's status every 2 s and shows it. Everything from the brain goes in as text,
// never as HTML: rejected origins in the events come from other pages.
const POLL_MS = 2000;
/** What the switch sends next: resume unless supervision is running. */
let pauseNext = true;
/** What the hack loop's switch sends next (#134): the other way from the status. */
let enableHackLoopNext = false;
/** What the hacking programs' switch sends next (#136), likewise. */
let enableProgramsNext = false;
/** What home RAM's switch sends next (#138), likewise. */
let enableHomeRamNext = false;

const element = (tag, text, className) => {
  const created = document.createElement(tag);
  if (text !== undefined) created.textContent = text;
  if (className) created.className = className;
  return created;
};
const time = (ms) => (ms === null ? "never" : new Date(ms).toLocaleString());
const seconds = (ms) => `${(ms / 1000).toFixed(ms < 10000 ? 1 : 0)} s`;
const orNone = (value, format = String) => (value === null || value === undefined ? "—" : format(value));
const megabytes = (bytes) => `${(bytes / 1024 / 1024).toFixed(0)} MB`;

function fillTable(table, rows) {
  table.replaceChildren(
    ...rows.map(([label, value, className]) => {
      const row = element("tr");
      row.append(element("th", label), element("td", value, className));
      return row;
    }),
  );
}

/** Shows `message` in place of the data, which isn't current; null shows the data. */
function showProblem(message) {
  const problem = document.querySelector("#problem");
  problem.textContent = message ?? "";
  problem.hidden = message === null;
  document.querySelector("main").hidden = message !== null;
}

function render(status) {
  document.querySelector("#brain").textContent =
    `${status.environment} · brain ${status.brainRelease}, up since ${time(status.brainStartedAtMs)}`;

  const alerts = document.querySelector("#alerts div");
  alerts.replaceChildren(
    ...(status.alerts.length === 0
      ? [element("div", "None.", "ok")]
      : status.alerts.map((alert) => element("div", `${alert.name} since ${time(alert.sinceMs)}: ${alert.detail}`, "bad"))),
  );

  const agent = status.agent;
  fillTable(document.querySelector("#agent table"), [
    ["Connected", agent.connected ? "yes" : "no", agent.connected ? "ok" : "bad"],
    [agent.connected ? "Since" : "Last seen", time(agent.sinceMs)],
    ["Deployment", orNone(agent.deploymentId)],
    ["Session", orNone(agent.agentSessionId)],
    ["Game", agent.game ? `${agent.game.version} (${agent.game.commit}, ${agent.game.platform})` : "—"],
    ["Version", agent.game === null ? "—" : agent.versionDrift === null ? "the pinned one" : `not pinned: ${agent.versionDrift}`,
      agent.versionDrift === null ? "" : "bad"],
  ]);

  fillTable(
    document.querySelector("#tiers table"),
    Object.entries(status.tiers).map(([tier, last]) => [
      tier,
      last === null ? "none yet" : `${seconds(last.ageMs)} ago (${time(last.receivedAtMs)})`,
    ]),
  );

  const values = status.values;
  fillTable(document.querySelector("#values table"), [
    ["Money", orNone(values.money, (money) => `$${Math.round(money).toLocaleString()}`)],
    ["Hacking level", orNone(values.hackingLevel)],
    ["Home RAM", values.homeRamUsed === null ? "—" : `${values.homeRamUsed} of ${values.homeMaxRam} GB`],
    ["Scripts on home", orNone(values.homeScripts)],
    ["Page heap", orNone(values.pageHeapUsedBytes, megabytes)],
    ["Degraded tiers", values.degradedTiers.length === 0 ? "none" : values.degradedTiers.join(", "),
      values.degradedTiers.length === 0 ? "" : "bad"],
  ]);

  const gaps = status.gaps;
  document.querySelector("#gaps div").replaceChildren(
    element("div", `${gaps.count} fast snapshots, longest interval ${seconds(gaps.longestIntervalMs)}, threshold ${seconds(gaps.thresholdMs)}.`),
    ...(gaps.gapCount === 0
      ? [element("div", "No gaps.", "ok")]
      : [
          element("div", `${gaps.gapCount} gaps, ${seconds(gaps.totalGapMs)} in all${gaps.gapCount > gaps.newestGaps.length ? `; the newest ${gaps.newestGaps.length}:` : ":"}`, "bad"),
          ...gaps.newestGaps.map((gap) => element("div", `${time(gap.fromMs)} to ${time(gap.toMs)} (${seconds(gap.lengthMs)})`)),
        ]),
  );

  const supervision = status.supervision;
  pauseNext = supervision.state === "running";
  const stateText = {
    off: "off: only a brain for Steam's game, on Windows, supervises it",
    running: "running",
    paused: "paused: nothing is relaunched",
    gaveUp: "gave up after too many relaunches",
  };
  const stateStyle = { off: "muted", running: "ok", paused: "bad", gaveUp: "bad" };
  document.querySelector("#supervision div").replaceChildren(
    element("div", `Supervision: ${stateText[supervision.state]}`, stateStyle[supervision.state]),
    ...supervision.relaunches.map((relaunch) => element("div", `Relaunched ${time(relaunch.atMs)}: ${JSON.stringify(relaunch.detail)}`)),
  );
  const switchButton = document.querySelector("#supervision button");
  switchButton.textContent = pauseNext ? "Pause supervision" : "Resume supervision";
  // Off, nothing reads the switch: no button to suggest otherwise.
  switchButton.hidden = supervision.state === "off";

  const hackLoop = status.hackLoop;
  enableHackLoopNext = !hackLoop.enabled;
  const hackLoopText = !hackLoop.enabled
    ? "off"
    : hackLoop.waiting
      ? "on, waiting for the Agent's snapshots"
      : hackLoop.target === null
        ? "on, rooting servers; no target yet"
        : `on, against ${hackLoop.target}, on ${hackLoop.hosts.length} servers`;
  document.querySelector("#hack-loop div").replaceChildren(
    element("div", `Hack loop: ${hackLoopText}`, hackLoop.enabled ? "ok" : "muted"),
  );
  document.querySelector("#hack-loop button").textContent = hackLoop.enabled ? "Stop the hack loop" : "Start the hack loop";

  const programs = status.programs;
  enableProgramsNext = !programs.enabled;
  const programsText = !programs.enabled
    ? "not buying"
    : programs.waiting
      ? "waiting for the Agent's snapshots"
      : programs.buying !== null
        ? `buying ${programs.buying}`
        : programs.waitingFor !== null
          ? `waiting for ${programs.waitingFor}`
          : "all bought";
  document.querySelector("#programs div").replaceChildren(
    element("div", `Hacking programs: ${programsText}`, programs.enabled ? "ok" : "muted"),
    element("div", `Owned: ${programs.owned.length === 0 ? "none" : programs.owned.join(", ")}`),
  );
  document.querySelector("#programs button").textContent = programs.enabled ? "Stop buying programs" : "Start buying programs";

  const homeRam = status.homeRam;
  enableHomeRamNext = !homeRam.enabled;
  const homeRamText = !homeRam.enabled
    ? "not upgrading"
    : homeRam.waiting
      ? "waiting for the Agent's snapshots"
      : homeRam.upgradingTo !== null
        ? `upgrading to ${homeRam.upgradingTo} GB`
        : homeRam.waitingFor !== null
          ? `waiting for ${homeRam.waitingFor}`
          : "at its limit";
  document.querySelector("#home-ram div").replaceChildren(
    element("div", `Home RAM: ${homeRamText}`, homeRam.enabled ? "ok" : "muted"),
    element("div", `Home: ${orNone(homeRam.ram, (ram) => `${ram} GB`)}`),
  );
  document.querySelector("#home-ram button").textContent = homeRam.enabled ? "Stop upgrading home RAM" : "Start upgrading home RAM";

  // With the backend of the last try (#145), unless an older Agent didn't say.
  const via = (outcome) => (outcome.backend === null || outcome.backend === undefined ? "" : ` via ${outcome.backend}`);
  const outcomeText = (outcome) =>
    outcome === null
      ? "not reported yet"
      : outcome.done
        ? `done${via(outcome)}${outcome.problem === null ? "" : ` (${outcome.problem})`}`
        : `${outcome.tries} ${outcome.tries === 1 ? "try" : "tries"}${via(outcome)}${outcome.problem === null ? "" : `: ${outcome.problem}`}`;
  const intentRows = status.intents.map((intent) => {
    const row = element("tr");
    const cancel = element("td");
    if (intent.source === "manual") {
      const button = element("button", "Cancel");
      button.type = "button";
      button.addEventListener("click", () => sendWrite("/api/intents/cancel", { id: intent.id }, "#intents-problem"));
      cancel.append(button);
    }
    // An irreversible intent (#147), or one queued after an install (#164), not yet sent says what it waits for.
    const state = intent.waitingFor ? `not sent: ${intent.waitingFor}` : outcomeText(intent.outcome);
    row.append(element("td", intent.id), element("td", intent.source), element("td", state), cancel);
    return row;
  });
  document.querySelector("#intents table").replaceChildren(
    ...(intentRows.length === 0 ? [element("tr", "None.")] : intentRows),
  );

  // The work the brain manages (#151, #153, #156), and how the Agent last reported it.
  const { desired, outcome: workOutcome } = status.work;
  const workName = (work) =>
    work.kind === "company"
      ? `${work.field} work at ${work.company}`
      : work.kind === "crime"
        ? work.crime
        : `${work.workType} work for ${work.faction}`;
  const workText =
    desired === null
      ? "Not managed: the game's work is left as it is."
      : `${workName(desired)}, ${desired.focus ? "focused" : "unfocused"}: ` +
        (workOutcome === null
          ? "not reported yet"
          : `${workOutcome.converged ? "converged" : "not converged"}${via(workOutcome)}` +
            (workOutcome.problem === null ? "" : ` (${workOutcome.problem})`));
  document.querySelector("#work div").replaceChildren(element("div", workText, desired === null ? "muted" : "ok"));

  const events = document.querySelector("#events table");
  events.replaceChildren(
    ...status.events.map((event) => {
      const row = element("tr");
      const detail = element("td");
      detail.append(element("code", JSON.stringify(event.detail)));
      row.append(element("td", time(event.atMs)), element("td", event.kind), detail);
      return row;
    }),
  );
}

async function refresh() {
  let response;
  try {
    response = await fetch("/api/status", { cache: "no-store" });
  } catch {
    return showProblem("Brain unreachable: the dashboard can't reach the brain, so nothing here is current.");
  }
  if (!response.ok) {
    return showProblem(`The brain couldn't answer (HTTP ${response.status}): see its log. Nothing here is current.`);
  }
  try {
    render(await response.json());
    showProblem(null);
  } catch (error) {
    showProblem(`The dashboard couldn't show the brain's status: ${error}`);
  }
}

/** Sends a write, says so if it didn't take (with the brain's reason, if any), and shows the state afterwards. */
async function sendWrite(path, body, problemSelector, failure = "It didn't take") {
  const writeProblem = document.querySelector(problemSelector);
  writeProblem.hidden = true;
  try {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!response.ok) {
      const reason = await response.text();
      throw new Error(`HTTP ${response.status}${reason ? `: ${reason}` : ""}`);
    }
  } catch (error) {
    writeProblem.textContent = `${failure}: ${error.message}`;
    writeProblem.hidden = false;
  }
  await refresh();
}
const sendSwitch = (path, body, problemSelector) => sendWrite(path, body, problemSelector, "The switch didn't change");

document.querySelector("#supervision button").addEventListener("click", () =>
  sendSwitch("/api/supervision", { paused: pauseNext }, "#supervision-problem"),
);
document.querySelector("#hack-loop button").addEventListener("click", () =>
  sendSwitch("/api/hack-loop", { enabled: enableHackLoopNext }, "#hack-loop-problem"),
);
document.querySelector("#programs button").addEventListener("click", () =>
  sendSwitch("/api/programs", { enabled: enableProgramsNext }, "#programs-problem"),
);
document.querySelector("#home-ram button").addEventListener("click", () =>
  sendSwitch("/api/home-ram", { enabled: enableHomeRamNext }, "#home-ram-problem"),
);
document.querySelector("#intents form").addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.currentTarget;
  let args;
  try {
    args = JSON.parse(form.elements.args.value);
  } catch {
    const problem = document.querySelector("#intents-problem");
    problem.textContent = "The arguments aren't JSON";
    problem.hidden = false;
    return;
  }
  sendWrite("/api/intents", { action: form.elements.action.value, args }, "#intents-problem", "Not queued");
});

document.querySelector("#faction-work").addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.currentTarget;
  const work = { faction: form.elements.faction.value, workType: form.elements.workType.value };
  sendWrite("/api/work", { work }, "#work-problem", "Not set");
});
document.querySelector("#company-work").addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.currentTarget;
  const work = { kind: "company", company: form.elements.company.value, field: form.elements.field.value };
  sendWrite("/api/work", { work }, "#work-problem", "Not set");
});
document.querySelector("#crime-work").addEventListener("submit", (event) => {
  event.preventDefault();
  const work = { kind: "crime", crime: event.currentTarget.elements.crime.value };
  sendWrite("/api/work", { work }, "#work-problem", "Not set");
});
document.querySelector("#stop-work").addEventListener("click", () =>
  sendWrite("/api/work", { work: null }, "#work-problem", "Not stopped"),
);

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
