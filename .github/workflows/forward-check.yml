# Advisory forward check against upstream `dev` (ADR 0005, 0009, tools/upstream-watch/README.md). It keeps one tracking
# issue up to date and closes it when there's nothing to report. It runs only when dispatched (every release runs it,
# docs/releasing.md step 2), never on pull requests, and isn't a required check.
name: Forward check (upstream dev)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to compare with the pinned game (a branch as origin/<name>, a tag or a commit)
        default: origin/dev
        required: true
      dry_run:
        description: Print what it would do, and touch no issue
        type: boolean
        default: false

permissions: {}

concurrency:
  group: forward-check
  cancel-in-progress: false

jobs:
  watch:
    uses: ./.github/workflows/upstream-watch.yml
    permissions:
      contents: read
      issues: write
    with:
      ref: ${{ inputs.ref }}
      watcher: dev
      title: Upcoming game changes (upstream dev)
      prefix: Upcoming game changes (upstream dev)
      publish_on: changes
      when_empty: close
      dry_run: ${{ inputs.dry_run }}
