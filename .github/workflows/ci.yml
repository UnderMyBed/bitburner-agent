# Fast tiers on every PR and on main (ADR 0004). The job name `check` is the required status check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # every main commit gets a result

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # vendor/bitburner-src: contract tests read the pinned game source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # The simulator bundles the game; its dependencies come from the game's own lockfile (packages/sim/README.md).
      - name: Cache the game's dependencies
        id: game-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bitburner-src/node_modules
          key: game-deps-${{ runner.os }}-${{ hashFiles('vendor/bitburner-src/package-lock.json', 'packages/sim/scripts/setup-engine.ts', 'packages/sim/src/engine/vendor.ts', '.node-version') }}
      - name: Install the game's dependencies
        if: steps.game-deps.outputs.cache-hit != 'true'
        run: npm run setup:engine
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and format
        run: npm run lint
      - name: Test
        run: npm test
