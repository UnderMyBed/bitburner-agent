# WIP, #426's research only (never to merge): the replay-mix research on Linux, one job a route, and the tests behind
# the stop conditions (core's growth and replays tests), on pushes to the replay-mix branch.
name: r426 research

on:
  push:
    branches: [replay-mix]

permissions:
  contents: read

concurrency:
  group: r426-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: r426 (${{ matrix.file }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        file: [bn6-keep, bn6-best, bn7-keep, bn7-best, skills-0, skills-1, skills-2, skills-3, skills-4, skills-5, skills-6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache the game's dependencies
        id: game-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bitburner-src/node_modules
          key: game-deps-${{ runner.os }}-${{ hashFiles('vendor/bitburner-src/package-lock.json', 'packages/sim/scripts/setup-engine.ts', 'packages/sim/src/engine/vendor.ts', '.node-version') }}
      - name: Install the game's dependencies
        if: steps.game-deps.outputs.cache-hit != 'true'
        run: npm run setup:engine
      - name: Research
        env:
          R426: "1"
        run: npx vitest run packages/core/test/r426-${{ matrix.file }}.test.ts --maxWorkers=1 --reporter=verbose

  stops:
    name: the stop conditions (core's growth and replays tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache the game's dependencies
        id: game-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/bitburner-src/node_modules
          key: game-deps-${{ runner.os }}-${{ hashFiles('vendor/bitburner-src/package-lock.json', 'packages/sim/scripts/setup-engine.ts', 'packages/sim/src/engine/vendor.ts', '.node-version') }}
      - name: Install the game's dependencies
        if: steps.game-deps.outputs.cache-hit != 'true'
        run: npm run setup:engine
      - name: Growth and replays
        run: npx vitest run packages/core/test/bladeburner-growth.test.ts packages/core/test/bladeburner-replays.test.ts --maxWorkers=1 --reporter=verbose
