# The stable watcher (ADR 0003, 0010, tools/upstream-watch/README.md). Steam ships from upstream `stable`, so when it
# moves ahead of the pinned game, a Steam update is coming: this keeps one issue with the compatibility report and the
# bump steps. When `stable` is the pinned commit, it does nothing; an open issue stays for the bump PR to close.
# It runs only when dispatched (every release runs it, docs/releasing.md step 2), never on pull requests, and isn't a
# required check.
name: Stable watch (upstream stable)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to treat as stable. Anything but origin/stable is a test, so it's always a dry run.
        default: origin/stable
        required: true
      dry_run:
        description: Print what it would do, and touch no issue
        type: boolean
        default: false

permissions: {}

concurrency:
  group: stable-watch
  cancel-in-progress: false

jobs:
  watch:
    uses: ./.github/workflows/upstream-watch.yml
    permissions:
      contents: read
      issues: write
    with:
      ref: ${{ inputs.ref }}
      watcher: stable
      title: "Upstream stable moved: v{version} ({sha})"
      prefix: Upstream stable moved
      publish_on: moved
      when_empty: leave
      # A test ref would open an issue saying a Steam update is coming, which no bump PR would ever close.
      dry_run: ${{ inputs.dry_run || inputs.ref != 'origin/stable' }}
