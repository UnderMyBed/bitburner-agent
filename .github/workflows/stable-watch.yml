# The stable watcher (ADR 0003, 0010, tools/upstream-watch/README.md). Steam ships from upstream `stable`, so when it
# moves past the pinned game, a Steam update is coming: this keeps one issue with the compatibility report and the bump
# steps. It runs only when dispatched (every release runs it, docs/releasing.md step 2), never on pull requests, and
# isn't a required check. When `stable` is the pinned commit, it does nothing.
name: Stable watch (upstream stable)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to treat as stable (a branch as origin/<name>, a tag or a commit); for testing
        default: origin/stable
        required: true

permissions: {}

concurrency:
  group: stable-watch
  cancel-in-progress: false

jobs:
  # Reads upstream content, so it gets nothing but read access to this repository.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      # No submodule needed: the pinned commit is read from the gitlink.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Clone the game's history (blobless)
        run: git clone --quiet --filter=blob:none --no-checkout https://github.com/bitburner-official/bitburner-src.git "$RUNNER_TEMP/game"
      - name: Build the report
        id: report
        env:
          REF: ${{ inputs.ref }} # through the environment, never interpolated into the script
        run: |
          node tools/upstream-watch/cli.ts report --game "$RUNNER_TEMP/game" --ref "$REF" --watcher stable --out "$RUNNER_TEMP/report.json"
          echo "report=$(jq -c . "$RUNNER_TEMP/report.json")" >> "$GITHUB_OUTPUT"

  # Only runs our CLI on the finished report: it can write issues.
  publish:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Only a move counts; with none, an open issue is left for the bump PR to close.
      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.report.outputs.report }} # through the environment, never interpolated into the script
        run: |
          printf '%s' "$REPORT" > "$RUNNER_TEMP/report.json"
          node tools/upstream-watch/cli.ts publish --report "$RUNNER_TEMP/report.json" \
            --title "Upstream stable moved: v{version} ({sha})" --prefix "Upstream stable moved" \
            --on moved --when-empty leave
