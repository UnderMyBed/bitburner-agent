name: Bug
description: Something in this project's code behaves wrongly. (Bugs in the game itself belong upstream.)
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what was expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Scenario and seed for the simulator, or steps on a source build or Steam.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "Environment (architecture §9.4): E0 Steam, E1 simulator or E2 source build; plus agent release, game version, BitNode."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Decision-log excerpt, telemetry, logs, screenshots.
